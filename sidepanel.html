<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionFlow AI</title>
    <link rel="stylesheet" href="css/sidepannel.css" />
    <script src="js/packages/marked.min.js"></script>
  </head>
  <body>
    <main class="container">
      <div class="hero">
        <img src="image/logo.svg" alt="VisionFlow Logo" class="logo" />

        <h1>VisionFlow</h1>

        <p class="subtitle">Your AI assistant for the web</p>
      </div>

      <button id="startListening" class="listen-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="8" width="2.5" height="8" rx="1.25" />
          <rect x="9" y="5" width="2.5" height="14" rx="1.25" />
          <rect x="14" y="7" width="2.5" height="10" rx="1.25" />
          <rect x="19" y="9" width="2.5" height="6" rx="1.25" />
        </svg>
        <span>Start Listening</span>
      </button>
      

      <div class="tip">
        Click <strong>"Start Listening"</strong> and speak a command.
      </div>
    </main>

    <script type="module" src="js/sidepanel.js"></script>
    <script type="module" src="js/voiceInput.js"></script>
    
  </body>
</html>
